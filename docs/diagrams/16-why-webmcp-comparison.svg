ign: center;"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_E2_E3_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default win" id="flowchart-E1-9" transform="translate(176, 86)"><rect class="basic label-container" style="fill:#e0f5e6 !important;stroke:#40a060 !important;stroke-width:2px !important" x="-128" y="-45.5" width="256" height="91"/><g class="label" style="color:#000 !important" transform="translate(-100, -31.5)"><rect/><foreignObject width="200" height="63"><div style="color: rgb(0, 0, 0) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#000 !important" class="nodeLabel"><p>execute() runs INSIDE the user's tab holding the plaintext.</p></span></div></foreignObject></g></g><g class="node default win" id="flowchart-E2-10" transform="translate(512, 86)"><rect class="basic label-container" style="fill:#e0f5e6 !important;stroke:#40a060 !important;stroke-width:2px !important" x="-128" y="-45.5" width="256" height="91"/><g class="label" style="color:#000 !important" transform="translate(-100, -31.5)"><rect/><foreignObject width="200" height="63"><div style="color: rgb(0, 0, 0) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#000 !important" class="nodeLabel"><p>Local BM25 index returns 0 text; Selective Gate releases snippets.</p></span></div></foreignObject></g></g><g class="node default win" id="flowchart-E3-11" transform="translate(848, 86)"><rect class="basic label-container" style="fill:#e0f5e6 !important;stroke:#40a060 !important;stroke-width:2px !important" x="-128" y="-45.5" width="256" height="91"/><g class="label" style="color:#000 !important" transform="translate(-100, -31.5)"><rect/><foreignObject width="200" height="63"><div style="color: rgb(0, 0, 0) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#000 !important" class="nodeLabel"><p><b>Search and disclosure are separate capabilities. Real human-in-the-loop control.</b></p></span></div></foreignObject></g></g></g></g><g class="root" transform="translate(0, 188)"><g class="clusters"><g class="cluster container" id="TRAD" data-look="classic"><rect style="fill:#fbfbfd !important;stroke:#cccccc !important" x="8" y="8" width="1644" height="320"/><g class="cluster-label" transform="translate(682.5234375, 8)"><foreignObject width="294.953125" height="21"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel" style="color:#000 !important"><p>Why Alternatives Fail to Enforce the Boundary</p></span></div></foreignObject></g></g></g><g class="edgePaths"/><g class="edgeLabels"/><g class="nodes"><g class="root" transform="translate(32.5, 61)"><g class="clusters"><g class="cluster" id="T4" data-look="classic"><rect style="" x="8" y="8" width="361" height="198"/><g class="cluster-label" transform="translate(112.578125, 8)"><foreignObject width="151.84375" height="21"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"><p>4. Extension / OS Agent</p></span></div></foreignObject></g></g></g><g class="edgePaths"/><g class="edgeLabels"/><g class="nodes"><g class="node default fail" id="flowchart-D-8" transform="translate(188.5, 107)"><rect class="basic label-container" style="fill:#ffe0e0 !important;stroke:#c04040 !important" x="-128" y="-66.5" width="256" height="133"/><g class="label" style="color:#000 !important" transform="translate(-100, -52.5)"><rect/><foreignObject width="200" height="105"><div style="color: rgb(0, 0, 0) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#000 !important" class="nodeLabel"><p>Reads entire tab DOM or filesystem.<br /><b>No structured contract to allow metadata while sealing text.</b></p></span></div></foreignObject></g></g></g></g><g class="root" transform="translate(438.5, 50.5)"><g class="clusters"><g class="cluster" id="T3" data-look="classic"><rect style="" x="8" y="8" width="361" height="219"/><g class="cluster-label" transform="translate(93.2421875, 8)"><foreignObject width="190.515625" height="21"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"><p>3. Computer-Use / Playwright</p></span></div></foreignObject></g></g></g><g class="edgePaths"/><g class="edgeLabels"/><g class="nodes"><g class="node default fail" id="flowchart-C-7" transform="translate(188.5, 117.5)"><rect class="basic label-container" style="fill:#ffe0e0 !important;stroke:#c04040 !important" x="-128" y="-77" width="256" height="154"/><g class="label" style="color:#000 !important" transform="translate(-100, -63)"><rect/><foreignObject width="200" height="126"><div style="color: rgb(0, 0, 0) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#000 !important" class="nodeLabel"><p>Cannot join user's active session.<br />Must screenshot screen to read text.<br /><b>Plaintext leaks through screenshots into the LLM.</b></p></span></div></foreignObject></g></g></g></g><g class="root" transform="translate(844.5, 50.5)"><g class="clusters"><g class="cluster" id="T2" data-look="classic"><rect style="" x="8" y="8" width="361" height="219"/><g class="cluster-label" transform="translate(120.75, 8)"><foreignObject width="135.5" height="21"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"><p>2. REST API Backend</p></span></div></foreignObject></g></g></g><g class="edgePaths"/><g class="edgeLabels"/><g class="nodes"><g class="node default fail" id="flowchart-B-6" transform="translate(188.5, 117.5)"><rect class="basic label-container" style="fill:#ffe0e0 !important;stroke:#c04040 !important" x="-128" y="-77" width="256" height="154"/><g class="label" style="color:#000 !important" transform="translate(-100, -63)"><rect/><foreignObject width="200" height="126"><div style="color: rgb(0, 0, 0) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#000 !important" class="nodeLabel"><p>No shared visual surface.<br />Human cannot watch or approve in flow.<br /><b>Per-page approval requires looking at the same live page.</b></p></span></div></foreignObject></g></g></g></g><g class="root" transform="translate(1250.5, 40)"><g class="clusters"><g class="cluster" id="T1" data-look="classic"><rect style="" x="8" y="8" width="361" height="240"/><g class="cluster-label" transform="translate(126.1796875, 8)"><foreignObject width="124.640625" height="21"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"><p>1. Server-Side MCP</p></span></div></foreignObject></g></g></g><g class="edgePaths"/><g class="edgeLabels"/><g class="nodes"><g class="node default fail" id="flowchart-A-5" transform="translate(188.5, 128)"><rect class="basic label-container" style="fill:#ffe0e0 !important;stroke:#c04040 !important" x="-128" y="-87.5" width="256" height="175"/><g class="label" style="color:#000 !important" transform="translate(-100, -73.5)"><rect/><foreignObject width="200" height="147"><div style="color: rgb(0, 0, 0) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#000 !important" class="nodeLabel"><p>To search files, the server must hold them.<br />Uploading violates confidentiality.<br /><b>The server has already read what it pretends not to know.</b></p></span></div></foreignObject></g></g></g></g></g></g><g class="node default goal" id="flowchart-GOAL-0" transform="translate(1515.5, 74.5)"><rect class="basic label-container" style="fill:#ece0ff !important;stroke:#8050c0 !important;stroke-width:2px !important" x="-128" y="-66.5" width="256" height="133"/><g class="label" style="color:#000 !important" transform="translate(-100, -52.5)"><rect/><foreignObject width="200" height="105"><div style="color: rgb(0, 0, 0) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#000 !important" class="nodeLabel"><p>THE CORE REQUIREMENT<br />An agent that can tell you WHERE the answer is in a document it is not permitted to read</p></span></div></foreignObject></g></g></g></g></g><text text-anchor="middle" x="1356.5" y="-25" class="flowchartTitleText">Why WebMCP — Architectural Comparison</text></svg>